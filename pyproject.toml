[project]
name = "ragproductionapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyanshu Rastogi", email = "83832376+Oriyans-sunset@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "openai>=3.0.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
ragproductionapp = "ragproductionapp:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
